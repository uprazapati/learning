<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Designing Data-Intensive Applications</title>
<style>
:root{ --brand:#0176D3; --brand-dark:#014486; --brand-light:#D8EDFF;
         --canvas:#F3F3F3; --surface:#FFFFFF; --ink:#181818; --ink-soft:#747474; --rule:#C9C9C9; }
  *{box-sizing:border-box;}
  body{ margin:0; color:var(--ink); background:var(--canvas);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .layout{ display:flex; min-height:100vh; align-items:flex-start; border-top:3px solid var(--brand); }
  .sidebar{ width:240px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--rule);
            padding:20px 8px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .sidebar-title{ font-size:12px; color:var(--ink-soft); margin:0 0 8px; padding:0 12px; }
  .chapter-nav{ display:flex; flex-direction:column; gap:1px; }
  .chapter-link{ display:flex; justify-content:space-between; align-items:center; gap:8px;
                 width:100%; text-align:left; font:inherit; font-size:14px; padding:9px 12px;
                 border:none; border-left:3px solid transparent; background:none; color:var(--ink); cursor:pointer; }
  .chapter-link:hover{ background:var(--canvas); }
  .chapter-link.active{ background:var(--brand-light); border-left-color:var(--brand); color:var(--brand-dark); font-weight:bold; }
  .chapter-count{ font-size:11px; color:var(--ink-soft); }
  .chapter-link.active .chapter-count{ color:var(--brand-dark); }
  .chapter-name{ font-weight:600; line-height:1.35; }
  .content{ flex:1; min-width:0; }
  header{ padding:36px 32px; background:linear-gradient(135deg, var(--brand-dark), var(--brand)); color:#fff; }
  header h1{ margin:0 0 6px; font-size:clamp(24px,3vw,32px); font-weight:700; }
  header p{ margin:0; color:rgba(255,255,255,.85); font-size:15px; }
  header .byline{ margin-top:4px; font-size:13px; color:rgba(255,255,255,.7); }
  main{ max-width:1280px; margin:0 auto; padding:40px 32px; }
  .chapter-panel{ display:none; }
  .chapter-panel.active{ display:block; }
  .note{ margin-bottom:28px; }
  .note-title{ font-size:20px; margin:0; }
  .note-toggle{ display:flex; align-items:center; justify-content:space-between; gap:12px;
                width:100%; text-align:left; font:inherit; font-size:inherit;
                padding:10px 14px; margin:0; border:1px solid var(--rule); border-radius:.25rem;
                background:var(--surface); color:var(--ink); cursor:pointer; }
  .note-toggle:hover{ border-color:var(--brand); color:var(--brand-dark); }
  .note-toggle-label{ font-size:18px; font-weight:600; }
  .note-chevron{ flex-shrink:0; display:flex; transition:transform 0.25s ease; color:var(--ink-soft); }
  .note.expanded .note-chevron{ transform:rotate(90deg); }
  .note-host-wrap{ max-height:0; overflow:hidden; opacity:0;
                    transition:max-height 0.35s ease, opacity 0.3s ease; }
  .note.expanded .note-host-wrap{ opacity:1; }
  .note-host{ margin:14px 6px 6px; border-radius:2px; overflow:hidden; border-left:4px solid var(--brand);
              transform:rotate(-0.35deg); box-shadow:0 6px 16px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.08); }
  .empty, .nav-empty{ color:var(--ink-soft); font-size:14px; }
  @media (max-width:720px){
    .layout{ flex-direction:column; }
    .sidebar{ width:auto; position:static; height:auto; border-right:none; border-bottom:1px solid var(--rule); }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&family=Source+Serif+4:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <p class="sidebar-title">Chapters</p>
    <nav class="chapter-nav"><button type="button" class="chapter-link active" data-chapter="0"><span class="chapter-name">Chapter 1. Trade-offs in Data Systems Architecture</span><span class="chapter-count">6</span></button><button type="button" class="chapter-link" data-chapter="1"><span class="chapter-name">Chapter 2. Defining Nonfunctional Requirements</span><span class="chapter-count">5</span></button></nav>
  </aside>
  <div class="content">
    <header>
      <h1>Designing Data-Intensive Applications</h1>
      <p>Personal reading notes, organized by chapter.</p>
      <p class="byline">by Ujjwal Prazapati</p>
    </header>
    <main><div class="chapter-panel active" data-chapter="0"><section class="note" id="note-0"><h2 class="note-title"><button type="button" class="note-toggle" data-note="0"><span class="note-toggle-label">pinot-vs-traditional-olap-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-0"><div class="note-host" id="host-0"></div></div></section><section class="note" id="note-1"><h2 class="note-title"><button type="button" class="note-toggle" data-note="1"><span class="note-toggle-label">data-warehouse-vs-data-lake-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-1"><div class="note-host" id="host-1"></div></div></section><section class="note" id="note-2"><h2 class="note-title"><button type="button" class="note-toggle" data-note="2"><span class="note-toggle-label">cloud-vs-self-hosting-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-2"><div class="note-host" id="host-2"></div></div></section><section class="note" id="note-3"><h2 class="note-title"><button type="button" class="note-toggle" data-note="3"><span class="note-toggle-label">cloud-native-architecture-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-3"><div class="note-host" id="host-3"></div></div></section><section class="note" id="note-4"><h2 class="note-title"><button type="button" class="note-toggle" data-note="4"><span class="note-toggle-label">microservices-and-serverless-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-4"><div class="note-host" id="host-4"></div></div></section><section class="note" id="note-5"><h2 class="note-title"><button type="button" class="note-toggle" data-note="5"><span class="note-toggle-label">cloud-vs-supercomputing-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-5"><div class="note-host" id="host-5"></div></div></section></div><div class="chapter-panel" data-chapter="1"><section class="note" id="note-6"><h2 class="note-title"><button type="button" class="note-toggle" data-note="6"><span class="note-toggle-label">social-network-home-timelines-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-6"><div class="note-host" id="host-6"></div></div></section><section class="note" id="note-7"><h2 class="note-title"><button type="button" class="note-toggle" data-note="7"><span class="note-toggle-label">describing-performance-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-7"><div class="note-host" id="host-7"></div></div></section><section class="note" id="note-8"><h2 class="note-title"><button type="button" class="note-toggle" data-note="8"><span class="note-toggle-label">response-time-metrics-and-fault-tolerance-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-8"><div class="note-host" id="host-8"></div></div></section><section class="note" id="note-9"><h2 class="note-title"><button type="button" class="note-toggle" data-note="9"><span class="note-toggle-label">redundancy-software-faults-and-humans-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-9"><div class="note-host" id="host-9"></div></div></section><section class="note" id="note-10"><h2 class="note-title"><button type="button" class="note-toggle" data-note="10"><span class="note-toggle-label">scalability-notes</span><span class="note-chevron" aria-hidden="true"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button></h2><div class="note-host-wrap" id="wrap-10"><div class="note-host" id="host-10"></div></div></section></div></main>
  </div>
</div>
<script>
  var NOTES = {
  "0": "notes/ch01/pinot-vs-traditional-olap-notes.html",
  "1": "notes/ch01/data-warehouse-vs-data-lake-notes.html",
  "2": "notes/ch01/cloud-vs-self-hosting-notes.html",
  "3": "notes/ch01/cloud-native-architecture-notes.html",
  "4": "notes/ch01/microservices-and-serverless-notes.html",
  "5": "notes/ch01/cloud-vs-supercomputing-notes.html",
  "6": "notes/ch02/social-network-home-timelines-notes.html",
  "7": "notes/ch02/describing-performance-notes.html",
  "8": "notes/ch02/response-time-metrics-and-fault-tolerance-notes.html",
  "9": "notes/ch02/redundancy-software-faults-and-humans-notes.html",
  "10": "notes/ch02/scalability-notes.html"
};
  Promise.all(Object.keys(NOTES).map(function (i) {
    return fetch(NOTES[i]).then(function (r) { return r.text(); }).then(function (html) {
      var host = document.getElementById("host-" + i);
      if (!host) return;
      var root = host.attachShadow ? host.attachShadow({ mode: "open" }) : host;
      root.innerHTML = html;
    });
  }));

  var chapterLinks = Array.prototype.slice.call(document.querySelectorAll(".chapter-link"));
  var chapterPanels = Array.prototype.slice.call(document.querySelectorAll(".chapter-panel"));
  chapterLinks.forEach(function (link) {
    link.addEventListener("click", function () {
      var target = link.getAttribute("data-chapter");
      chapterLinks.forEach(function (l) { l.classList.toggle("active", l === link); });
      chapterPanels.forEach(function (p) {
        p.classList.toggle("active", p.getAttribute("data-chapter") === target);
      });
    });
  });

  var noteToggles = Array.prototype.slice.call(document.querySelectorAll(".note-toggle"));
  noteToggles.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var section = btn.closest(".note");
      var wrap = document.getElementById("wrap-" + btn.getAttribute("data-note"));
      if (!section || !wrap) return;
      var expanding = !section.classList.contains("expanded");
      section.classList.toggle("expanded", expanding);
      wrap.style.maxHeight = expanding ? wrap.scrollHeight + "px" : "0px";
    });
  });
</script>
</body>
</html>
